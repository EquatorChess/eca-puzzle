:root{--krem:#F1ECE5;--maroon:#5A0F1A;--maroon-d:#350911;--jambu:#F2DBD5;--mm:#844448;--bata:#AA3F3F;--kopi:#3F322F;--kunyit:#F2A532;--kunyit-d:#B9760C;
--bg:#F1ECE5;--card:#FFFDF9;--ink:#3F322F;--ink2:#6b5a56;--line:#E2D6CB;--accent:#5A0F1A;--accent-d:#350911;--accent-ink:#fff;
--ok:#2c7a3c;--ok-d:#1f5a2b;--ok-bg:#DDEFD4;--ok-ink:#1b4d26;--no:#AA3F3F;--no-d:#7a2626;--no-bg:#F7D9D4;--no-ink:#7a2626;
--hd:#844448;--lb:#844448;--thr:#D93030;--mvc:#E8901A;
--sq-l:#F2DBD5;--sq-d:#C08A87;--dock:74px;
--head:Gabarito,"Trebuchet MS","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#1d1416;--card:#2a1d20;--ink:#F1ECE5;--ink2:#c9b9b3;--line:#463337;--accent:#F2DBD5;--accent-d:#B98f89;--accent-ink:#3a0a12;--ok-bg:#1f3a25;--ok-ink:#bfe8c6;--no-bg:#4a2326;--no-ink:#f5c7c2;--sq-d:#8c5658;
--hd:#F5B651;--lb:#F4B8AE}
 .nd.dk{color:#fff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
svg{display:block}
button{font-family:inherit}
[hidden]{display:none!important}
/* notasi gambar bidak di teks */
.fg{padding:0!important;border-radius:0!important;background:none!important;display:inline-block;width:1.05em;height:1.2em;vertical-align:-.25em;margin:0 1px 0 0}
.fg svg{width:100%;height:100%}
.hd{background:var(--maroon);padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top))}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:30px;width:auto;flex:none}
.hd-r{display:flex;align-items:center;gap:10px;color:#F1ECE5;min-width:0}
.hdt{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;min-width:0}
.hdt b{font:800 16px var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.hdt small{font:400 11.5px var(--body);color:#d9c7c1;letter-spacing:.3px}
.ibtn{width:40px;height:40px;border-radius:12px;border:2px solid #F1ECE555;background:transparent;color:#F1ECE5;display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn svg{width:22px;height:22px}
.ibtn[aria-pressed=false]{opacity:.6}
/* jalur Kudi */
.top{max-width:1100px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:10px}
.mapb{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--maroon);display:grid;place-items:center;cursor:pointer;flex:none}
.mapb svg{width:22px;height:22px}
@media (prefers-color-scheme:dark){.mapb{color:var(--jambu)}}
.path{flex:1;height:60px;position:relative}
.pin{position:absolute;left:16px;right:16px;top:0;bottom:0}
.pl{position:absolute;left:0;right:0;top:43px;border-top:4px dotted var(--kunyit-d);opacity:.55}
.nd{position:absolute;top:29px;width:24px;height:28px;margin-left:-12px;border-radius:8px;border:2px solid var(--maroon);display:grid;place-items:center;font:800 13px var(--head);cursor:pointer;padding:0;color:var(--maroon);transition:background .3s,transform .3s}
.nd.lt{background:var(--sq-l)}.nd.dk{background:var(--sq-d)}
.nd svg{width:14px;height:14px}
.nd.done{background:var(--kunyit);border-color:var(--kunyit-d);color:#3a0a12}
.nd.now{transform:scale(1.18);box-shadow:0 0 0 3px var(--kunyit)}
.nd.lock{opacity:.55;border-style:dashed;cursor:not-allowed}
.pin.dense .nd{width:19px;height:23px;margin-left:-9.5px;top:31px;font-size:11.5px;border-radius:6px;border-width:2px}.pin.dense .nd svg{width:12px;height:12px}.pin.dense .nd.now{transform:scale(1.3)}
.pk{position:absolute;top:-6px;width:32px;height:36px;margin-left:-16px;transition:left .6s cubic-bezier(.4,.1,.3,1);pointer-events:none;z-index:2}
.pk svg{width:100%;height:100%;overflow:visible;transform-origin:50% 90%}
.chip{display:flex;align-items:center;gap:3px;font:800 17px var(--head);color:var(--ink2);transition:transform .2s;flex:none}
.chip svg{width:20px;height:20px}
.chip.hot{color:#A34400}
@media (prefers-color-scheme:dark){.chip.hot{color:#FF9B45}}
.chip.xp{color:var(--maroon)}
@media (prefers-color-scheme:dark){.chip.xp{color:var(--kunyit)}}
.chip.pop{animation:pop .4s}
main{max-width:1100px;margin:0 auto;padding:6px 16px calc(var(--dock) + 30px)}
.stage{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "board" "rest";gap:10px}
@media (min-width:900px){.stage{grid-template-columns:minmax(0,1fr) minmax(0,600px);grid-template-areas:"top board" "rest board";grid-template-rows:auto 1fr;gap:14px 36px;padding-top:12px}
 .a-board{position:sticky;top:12px;align-self:start}}
.a-top{grid-area:top}.a-board{grid-area:board}.a-rest{grid-area:rest}
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.badge{background:var(--kunyit);color:#3a0a12;font:800 12.5px var(--head);letter-spacing:.6px;text-transform:uppercase;padding:4px 10px;border-radius:10px;box-shadow:0 2px 0 var(--kunyit-d)}
.tag{background:var(--jambu);color:var(--maroon);font:800 12.5px var(--head);letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:10px}
.turn{display:inline-flex;align-items:center;gap:7px;font:800 13.5px var(--head);letter-spacing:.5px;text-transform:uppercase;color:var(--lb);margin-bottom:2px}
.chips{margin-left:auto;display:flex;gap:10px;align-items:center}
.turn i{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--kopi);display:inline-block}
@media (prefers-color-scheme:dark){.turn i{border-color:#F1ECE5}}
.turn i.w{background:#F1ECE5}.turn i.b{background:var(--kopi)}
@media (prefers-color-scheme:dark){.turn i.b{background:#1d1416}}
.kudi-row{display:flex;align-items:center;gap:10px}
.kudi{width:62px;flex:none}
.kudi svg{width:100%;height:auto;overflow:visible;transform-origin:50% 90%}
.kudi.idle svg{animation:bob 3.2s ease-in-out infinite}
.kudi.hop svg{animation:hop .65s}
.kudi.wob svg{animation:wob .55s}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 52px 8px 13px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-9px;top:50%;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.spk{position:absolute;right:6px;top:6px;width:42px;height:42px;border-radius:12px;border:2px solid var(--kunyit-d);background:var(--kunyit);color:#3a0a12;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--kunyit-d);padding:0}
.spk svg{width:24px;height:24px}
.spk.talk{animation:pop .9s infinite}
.spk.sm{position:static;width:36px;height:36px;flex:none}.spk.sm svg{width:20px;height:20px}
#q{margin:0;font-weight:700;font-size:18px;line-height:1.3}
.say{margin:4px 0 0;font-size:15px;color:var(--ink2);line-height:1.4}
.say:empty{display:none}
@media (min-width:900px){.kudi{width:92px}#q{font-size:20px}.say{font-size:16px}}
.boardwrap{position:relative;width:100%;max-width:620px;margin:0 auto;aspect-ratio:1;background:var(--maroon);padding:7px;border-radius:22px;box-shadow:0 6px 0 var(--maroon-d);touch-action:pan-y pinch-zoom;user-select:none;-webkit-user-select:none}
svg#bd{width:100%;height:100%;border-radius:14px}
.boardwrap.shake{animation:shake .38s}
.boardwrap.flash{animation:flashok .6s}
.boardwrap.flashno{animation:flashno .6s}
.pc{transition:transform .24s cubic-bezier(.3,.8,.3,1),opacity .22s;cursor:grab}
.pc.drag{transition:none;cursor:grabbing;}
.ckp{animation:ckp .9s ease-in-out infinite}
.eye{transition:transform .14s ease-out}
.steps{display:flex;gap:6px;justify-content:center;margin:12px 0 0;min-height:10px}
.steps i{width:30px;height:8px;border-radius:99px;background:var(--line);transition:background .3s,transform .3s}
.steps i.on{background:var(--ok)}.steps i.now{background:var(--kunyit);transform:scaleY(1.3)}
body.xmode .a-board{position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0 2px}
@media (max-width:899px){body.xmode .boardwrap{max-width:min(290px,calc(100vw - 80px))}body.xmode .steps{display:none}}
.btn{font:800 15px var(--head);letter-spacing:.7px;text-transform:uppercase;border:0;border-radius:14px;padding:12px 18px;min-height:48px;cursor:pointer;color:var(--accent-ink);background:var(--accent);box-shadow:0 5px 0 var(--accent-d);transition:transform .07s,box-shadow .07s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.btn.kun{background:var(--kunyit);color:#3a0a12;box-shadow:0 5px 0 var(--kunyit-d)}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:0 4px 0 var(--line);border:2px solid var(--line);padding:10px 16px}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 5px 0 var(--ok-d)}
.btn.no{background:var(--bata);color:#fff;box-shadow:0 5px 0 var(--no-d)}
.btn.wa{background:#17803f;color:#fff;box-shadow:0 5px 0 #115f2f;text-decoration:none}
.btn.big{padding:16px 34px;font-size:17px}
.btn .cnt{background:#3a0a1222;border-radius:99px;padding:1px 8px;font-size:13px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--kunyit);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.dk-in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dk-in #bHint{flex:1;white-space:nowrap}
@media (max-width:480px){#bReset span{display:none}#bReset{padding:10px 14px}}
@media (min-width:900px){.dk-in #bHint{flex:none;min-width:240px}}
.menu{position:fixed;right:16px;bottom:calc(var(--dock) + 10px + env(safe-area-inset-bottom));z-index:25;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px;min-width:220px;box-shadow:0 8px 24px #0003}
.menu button{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:transparent;border:0;color:var(--ink);font:700 16px var(--body);padding:12px;border-radius:10px;cursor:pointer;min-height:46px}
.menu button:hover{background:var(--jambu);color:#3F322F}
.menu svg{width:20px;height:20px;flex:none}
.hints{margin:6px 0 0;padding:0;list-style:none}
.hints li{background:var(--jambu);color:#3F322F;border-radius:12px;padding:9px 13px;margin-top:8px;font-size:16px;animation:slide .3s}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);margin-top:8px}
.legend i{width:16px;height:16px;border-radius:4px;background:#F2A532;opacity:.75;display:inline-block}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
/* penjelasan berstruktur */
.xh{display:flex;align-items:center;gap:8px;margin:0 0 6px;justify-content:space-between}
.xtag{font:800 12.5px var(--head);letter-spacing:.6px;text-transform:uppercase;color:var(--lb)}
.idea{margin:0 0 10px;font-weight:700;font-size:17px;line-height:1.4}
.xt{font:800 14px var(--head);letter-spacing:.5px;text-transform:uppercase;color:var(--hd);margin:12px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.xt small{font:600 13px var(--body);text-transform:none;letter-spacing:0;color:var(--ink2)}
.xsteps{list-style:none;margin:0;padding:0}
.xsteps li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;font-size:16px;line-height:1.35;cursor:pointer;border:2px solid transparent}
.xsteps li.on{background:var(--jambu);color:#3F322F;border-color:var(--kunyit)}
.xsteps li.ext{opacity:.8}
.xsteps li .mc{flex:none;min-width:84px;justify-content:center}
.xwhy{margin:0;padding:0;list-style:none}
.xwhy li{position:relative;padding:3px 0 3px 22px;font-size:16px}
.xwhy li::before{content:"";position:absolute;left:3px;top:11px;width:10px;height:10px;border-radius:3px;background:var(--kunyit)}
.mc{display:inline-flex;align-items:center;gap:3px;padding:2px 9px 2px 6px;border-radius:10px;border:2px solid var(--maroon);font:800 15px/1.5 var(--head);cursor:pointer;background:var(--krem);color:var(--maroon);vertical-align:baseline;min-height:30px}
.mc.b{background:var(--kopi);color:var(--krem);border-color:var(--kopi)}
.mc svg{width:.95em;height:1.1em;flex:none}
.mc small{font:700 .78em var(--head);opacity:.8;margin-right:2px}
.mc.on{background:var(--kunyit);color:#3a0a12;border-color:var(--kunyit-d)}
.sc{display:inline-block;padding:0 7px;border-radius:8px;border:2px dashed var(--kunyit-d);font:800 14.5px/1.5 var(--head);cursor:pointer;background:transparent;color:inherit}
.sc:hover{background:var(--kunyit);color:#3a0a12}
.stp{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.stp button{min-width:46px;min-height:42px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--ink);font-size:16px;cursor:pointer}
.stp button:disabled{opacity:.35}
details{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;font:800 14px var(--head);letter-spacing:.4px;text-transform:uppercase;color:var(--hd);padding:8px 0;min-height:40px;list-style-position:inside}
.wrongs{margin:0;padding:0;list-style:none}
.wrongs li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 0;font-size:15.5px;border-bottom:1px dashed var(--line)}
.wrongs li:last-child{border:0}
.lines{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.lines button{font:700 14px var(--body);padding:6px 12px;border-radius:99px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-height:36px}
.lines button.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.mv{font:700 16px/2 var(--body)}
.mv>span{padding:2px 6px;border-radius:8px;cursor:pointer}
.mv>span.on{background:var(--kunyit);color:#3F322F}
.mv>span.ext{opacity:.6;font-style:italic}
.eng{margin:0;font-size:14.5px;color:var(--ink2)}
/* lembar umpan balik */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,1,.3,1);padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #0003}
.sheet:not(.show){visibility:hidden;transition:transform .32s cubic-bezier(.2,1,.3,1),visibility 0s .32s}
.sheet.show{transform:none}
.sheet.ok{background:var(--ok-bg);color:var(--ok-ink)}
.sheet.no{background:var(--no-bg);color:var(--no-ink)}
.sheet.info{background:var(--card);color:var(--ink);border-top:2px solid var(--line)}
.sh-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sh-k{width:54px;flex:none}.sh-k svg{width:100%;overflow:visible}
.sh-t{flex:1;min-width:200px}
.sh-t h2{margin:0;font:800 23px/1.15 var(--head)}
.sh-t p{margin:4px 0 0;font-size:15.5px}
.stars{display:flex;gap:4px;margin-top:6px}
.stars svg{width:26px;height:26px}
.sh-b{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:640px){.sh-b{width:100%}.sh-b .btn{flex:1}.sh-k{width:42px}.sh-t h2{font-size:20px}}
body.xmode .sheet:not(.no) .sh-in{flex-wrap:nowrap;gap:10px}body.xmode .sheet:not(.no) .sh-k{width:36px}body.xmode .sheet:not(.no) .sh-t{min-width:0}
body.xmode .sheet:not(.no) .sh-t h2{font-size:18px}body.xmode .sheet:not(.no) .sh-t p{display:none}body.xmode .sheet:not(.no) .stars{margin-top:2px}body.xmode .sheet:not(.no) .stars svg{width:18px;height:18px}
body.xmode .sheet:not(.no) .sh-b{width:auto}body.xmode .sheet:not(.no) .sh-b .btn{flex:none;min-height:44px;padding:10px 18px}
@media (max-width:899px){#ecard{scroll-margin-top:326px}}
@media (min-width:900px){.boardwrap{max-width:min(620px,max(380px,calc(100vh - 250px)))}.a-board{justify-self:end;width:100%;max-width:620px}}
/* peta soal */
.modal{position:fixed;inset:0;z-index:55;background:#0007;display:grid;place-items:center;padding:16px}
.mcard{background:var(--bg);border:2px solid var(--line);border-radius:22px;width:100%;max-width:440px;max-height:86vh;overflow:auto;padding:16px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mh h3{margin:0;font:800 22px var(--head);color:var(--maroon)}
@media (prefers-color-scheme:dark){.mh h3{color:var(--jambu)}}
.mh small{display:block;font:700 12.5px var(--head);letter-spacing:.6px;text-transform:uppercase;color:var(--lb)}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 12px;margin-bottom:9px;color:var(--ink);cursor:pointer;min-height:58px}
.mrow.now{border-color:var(--kunyit)}
.mrow.lock{border-style:dashed;cursor:not-allowed}
.mrow .nn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:800 16px var(--head);background:var(--sq-l);color:var(--maroon);flex:none}
.mrow.done .nn{background:var(--kunyit);color:#3a0a12}
.mrow b{display:block;font:800 16px var(--head)}
.mrow small{color:var(--ink2);font-size:13.5px}
.mrow .stars{margin:0 0 0 auto}.mrow .stars svg{width:18px;height:18px}
.mrow>svg{width:20px;height:20px;margin-left:auto;color:var(--ink2)}
.msec{font:800 12.5px var(--head);letter-spacing:.6px;text-transform:uppercase;color:var(--hd);margin:12px 2px 6px}
/* layar awal dan ringkasan */
#intro{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.intro-in{max-width:460px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.intro-in .sim{width:76px;height:76px}.intro-in .sim svg{width:100%;height:100%}
.intro-in h1{font:800 38px/1.08 var(--head);margin:2px 0 0;color:var(--maroon)}
@media (prefers-color-scheme:dark){.intro-in h1{color:var(--jambu)}}
.intro-in .sub{font:400 13px var(--body);letter-spacing:.2px;color:var(--ink2);margin:-4px 0 0}
.intro-in .kk{width:120px;margin:2px 0}.intro-in .kk svg{overflow:visible}
.intro-in ul{list-style:none;margin:0;padding:0;text-align:left;font-size:16px;color:var(--ink2)}
.intro-in li{padding:4px 0 4px 26px;position:relative}
.intro-in li::before{content:"";position:absolute;left:4px;top:11px;width:10px;height:10px;border-radius:3px;background:var(--kunyit)}
.intro-in small{color:var(--ink2);font-size:13.5px}
.lang{display:flex;gap:8px;width:100%}
.lang button{flex:1;font:800 15px var(--head);min-height:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:8px 10px}
.lang button[aria-pressed=true]{background:var(--maroon);border-color:var(--maroon);color:#fff}
@media (prefers-color-scheme:dark){.lang button[aria-pressed=true]{background:var(--jambu);border-color:var(--jambu);color:#3a0a12}}
.nm{width:100%;text-align:left}
.nm label{font:700 14px var(--head);color:var(--lb);display:block;margin-bottom:4px}
.nm input{width:100%;font:600 17px var(--body);padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.tts{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15.5px;cursor:pointer}
.tts input{width:24px;height:24px;accent-color:var(--maroon);flex:none}
#sum{max-width:640px;margin:10px auto 0;text-align:center}
#sum h2{font:800 30px var(--head);margin:6px 0;color:var(--maroon)}
@media (prefers-color-scheme:dark){#sum h2{color:var(--jambu)}}
.sum-k{width:130px;margin:0 auto}.sum-k svg{overflow:visible}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tile{border:2px solid var(--line);border-radius:16px;padding:10px 4px;background:var(--card)}
.tile b{display:block;font:800 22px var(--head)}
.tile span{font-size:11.5px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.rlist{text-align:left;margin:10px 0}
.rl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line)}
.rl small{display:block;color:var(--ink2);font-size:13.5px}
.rl .stars{margin:0}.rl .stars svg{width:22px;height:22px}
.diag{text-align:left;background:var(--jambu);color:#3F322F;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:15px}
.diag b{font-family:var(--head)}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(-1.5deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(2px) scale(1.08,.9)}50%{transform:translateY(-16px) scale(.95,1.08) rotate(-6deg)}75%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}45%{transform:rotate(10deg)}70%{transform:rotate(-6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes flashok{0%{box-shadow:0 6px 0 var(--maroon-d),0 0 0 0 #2c7a3c00}35%{box-shadow:0 6px 0 var(--maroon-d),0 0 0 10px #2c7a3caa}100%{box-shadow:0 6px 0 var(--maroon-d),0 0 0 22px #2c7a3c00}}
@keyframes flashno{0%{box-shadow:0 6px 0 var(--maroon-d),0 0 0 0 #d4393900}35%{box-shadow:0 6px 0 var(--maroon-d),0 0 0 10px #d43939bb}100%{box-shadow:0 6px 0 var(--maroon-d),0 0 0 22px #d4393900}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ckp{0%,100%{opacity:.35}50%{opacity:.8}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/*fix-scroll-22nov*/@media (max-width:899px){.boardwrap{max-width:min(620px,max(260px,calc(100vh - 110px)))}}</style>
