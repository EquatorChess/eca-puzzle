:root{color-scheme:light dark;--krem:#F1ECE5;--maroon:#5A0F1A;--maroon-d:#350911;--jambu:#F2DBD5;--kopi:#3F322F;--kunyit:#FFC800;--kunyit-d:#5A0F1A;--bata:#AA3F3F;
--bg:#F1ECE5;--card:#FFFDF9;--ink:#3F322F;--ink2:#6b5a56;--line:#E2D6CB;--accent:#5A0F1A;--accent-d:#350911;--accent-ink:#fff;--hd:#844448;
--ok:#2c7a3c;--ok-d:#1f5a2b;--ok-bg:#DDEFD4;--ok-ink:#1b4d26;--no-bg:#F7D9D4;--no-ink:#7a2626;--info-bg:#F2DBD5;--info-ink:#5A0F1A;
--sq-l:#F2DBD5;--sq-d:#C08A87;--frame:#5A0F1A;--frame-d:#350911;--dock:76px;
--head:Gabarito,"Trebuchet MS","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--kunyit-d:#9C7A00;--bg:#1d1416;--card:#2a1d20;--ink:#F1ECE5;--ink2:#c9b9b3;--line:#463337;--accent:#F2DBD5;--accent-d:#B98f89;--accent-ink:#3a0a12;--hd:#FFC800;
--ok-bg:#1f3a25;--ok-ink:#bfe8c6;--no-bg:#4a2326;--no-ink:#f5c7c2;--info-bg:#3a2629;--info-ink:#F2DBD5;--sq-d:#8c5658}}
svg#bd,svg#bd *{forced-color-adjust:none}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
svg{display:block}button{font-family:inherit}[hidden]{display:none!important}a{color:inherit}
.fg{display:inline-block;width:1.05em;height:1.2em;vertical-align:-.25em;margin:0 1px 0 0}.fg svg{width:100%;height:100%}
/* kepala */
.hd{background:var(--maroon);padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));position:sticky;top:0;z-index:25}
.bar{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:8px}
.logo{height:26px;width:auto;flex:none}
.hdt{flex:1;min-width:0;color:#F1ECE5;font:800 17px/1.2 var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;border-radius:12px;border:2px solid #F1ECE544;background:transparent;color:#F1ECE5;display:grid;place-items:center;cursor:pointer;flex:none;font:800 13px var(--head);padding:0}
.ibtn svg{width:22px;height:22px}.ibtn[aria-pressed=false]{opacity:.6}
.back{display:flex;align-items:center;gap:4px;height:42px;padding:0 10px 0 6px;border-radius:12px;border:2px solid #F1ECE544;background:transparent;color:#F1ECE5;font:800 14px var(--head);cursor:pointer;flex:none;text-decoration:none}
.back svg{width:20px;height:20px}
main{max-width:1100px;margin:0 auto;padding:8px 10px calc(var(--dock) + 26px)}
/* ===== menu latihan ===== */
#home{max-width:640px;margin:0 auto;padding-bottom:30px}
.hello{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 2px 10px;color:var(--ink2);font-size:15px}
.hello b{color:var(--ink)}
.kls{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.kls button{font:800 14px var(--head);min-height:40px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.kls button[aria-pressed=true]{background:var(--maroon);border-color:var(--maroon);color:#fff}
@media (prefers-color-scheme:dark){.kls button[aria-pressed=true]{background:var(--jambu);border-color:var(--jambu);color:#3a0a12}}
.hero{background:var(--maroon);color:#F1ECE5;border-radius:26px;padding:18px 16px 16px;box-shadow:0 7px 0 var(--maroon-d);overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,#FFC80040,transparent);pointer-events:none}
.hrow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hero .hk{width:104px;flex:none}.hero .hk svg{overflow:visible;width:100%;height:auto}
.hx{min-width:0;flex:1}
.hero h2{margin:0 0 6px;font:800 32px/1.05 var(--head);color:#fff;letter-spacing:-.3px}
.lvl{display:inline-block;background:var(--kunyit);color:#350911;font:800 17px/1 var(--head);padding:7px 14px;border-radius:99px}
.hero p{margin:8px 0 0;font-size:16.5px;line-height:1.3;color:#eadfda}
.hst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 14px;position:relative;z-index:1}
.hst div{background:#ffffff1c;border-radius:14px;padding:9px 6px 8px;text-align:center}
.hst b{display:block;font:800 24px/1.1 var(--head);color:#fff}.hst b small{font-size:15px;color:#e7d9d4;font-weight:700}
.hst span{display:block;margin-top:2px;font:800 11.5px/1.2 var(--head);letter-spacing:.6px;text-transform:uppercase;color:#FFC800}
.hst.done div:nth-child(2) b{color:#9BE7A9}
.hero .row{display:flex;gap:10px;position:relative;z-index:1}
.hero .btn{min-height:58px}
.hero .btn.big{flex:2;font-size:19px;letter-spacing:.8px}.hero .btn.big svg{width:24px;height:24px}
.btn.chal{flex:1;background:transparent;color:#FFC800;border:2px solid #FFC800aa;box-shadow:none;padding:8px 10px;font-size:14px;line-height:1.15;text-align:center}
@media (max-width:359px){.hero h2{font-size:27px}.hero .hk{width:84px}}
.ulang{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:10px 14px;color:var(--ink);cursor:pointer;text-align:left;font-size:15px;min-height:58px}
.ulang .ui{width:38px;height:38px;border-radius:12px;background:var(--kunyit);display:grid;place-items:center;flex:none;color:#3a0a12}
.ulang .ui svg{width:22px;height:22px}
.ulang b{display:block;font:800 17px var(--head)}.ulang small{color:var(--ink2)}
.temas{margin-top:30px}
.temas h2{margin:0;font:800 21px/1.2 var(--head);color:var(--ink)}
.temas .sub{margin:2px 0 10px;font-size:15px;color:var(--ink2)}
.fams{display:flex;gap:6px;overflow-x:auto;margin:0 -10px 8px;padding:2px 10px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fams::-webkit-scrollbar{display:none}
.fm{flex:none;display:flex;align-items:center;gap:7px;min-height:42px;padding:0 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 14.5px var(--head);cursor:pointer;white-space:nowrap}
.fm i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.fm[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}

 const kd=e=>{if(e.key==='Escape'){e.stopPropagation();fin(null)}};document.addEventListener('keydown',kd,true);

/* ===== analisis: Stockfish di browser (dimuat lazy saat tombol Analisis ditekan), bar evaluasi, papan bebas,
   panah langkah terbaik, badge langkah. Keputusan coach 22 Nov 2026: hanya Beginner ke atas (rating >= 700).
   Badge tahap 1: Best, Excellent, Good, Inaccuracy, Mistake, Blunder (Brilliant dan Miss tahap 2).
   Mesin: Stockfish 19 lite single-thread (GPL-3.0), berkas di sf/ (lihat sf/README.txt). ===== */
Object.assign(I18N.id,{anT:'Analisis',anLoad:'Memuat mesin…',anBest:'Terbaik',anMine:'Langkahmu',anSol:'Solusi',anDone:'Selesai',anFlip:'Putar papan',
 anFail:'Mesin analisis tidak bisa dimuat. Cek koneksi internet.',anCr:'Mesin: Stockfish (GPL-3.0)',anSrc:'kode sumber',anLic:'lisensi',anThink:'Menghitung…'});
Object.assign(I18N.en,{anT:'Analysis',anLoad:'Loading engine…',anBest:'Best move',anMine:'Your move',anSol:'Solution',anDone:'Done',anFlip:'Flip board',
 anFail:'The analysis engine could not be loaded. Check your internet connection.',anCr:'Engine: Stockfish (GPL-3.0)',anSrc:'source code',anLic:'license',anThink:'Thinking…'});

/* perangkat low-end: kedalaman dan waktu hitung dikurangi, mesin dimatikan 20 dtk setelah Analisis ditutup (25 Nov 2026) */
const AN_DEPTH=LOWEND?9:12,AN_MAXMS=LOWEND?1500:3500,AN_MINRATING=700;
const SF=(()=>{let w=null,ready=null,chain=Promise.resolve(),run=null,rel=0;const cache=new Map();let ok=false;
 function keep(){clearTimeout(rel)}
 function release(){clearTimeout(rel);rel=setTimeout(()=>{if(!run&&w){try{w.terminate()}catch(e){}w=null;ready=null;ok=false}},20000)}
 function boot(){if(ready)return ready;
  ready=new Promise((res,rej)=>{let to=setTimeout(()=>rej(new Error('timeout')),25000);
   try{w=new Worker('sf/stockfish-19-lite-single.js')}catch(e){clearTimeout(to);rej(e);return}
   w.onerror=e=>{clearTimeout(to);rej(e)};
   w.onmessage=ev=>{const l=String(ev.data||'');
    if(l==='uciok'){w.postMessage('setoption name Threads value 1');w.postMessage('setoption name Hash value 16');w.postMessage('isready')}
    else if(l==='readyok'){clearTimeout(to);w.onmessage=onMsg;ok=true;res()}};
   w.postMessage('uci')});
  ready.catch(()=>{ready=null;ok=false;try{w&&w.terminate()}catch(e){}w=null});return ready}
 function onMsg(ev){const l=String(ev.data||''),t=run;if(!t)return;
  if(l.startsWith('info')&&l.includes(' score ')&&!/bound/.test(l)){
   const sc=/ score (cp|mate) (-?\d+)/.exec(l),pv=/ pv (.+)$/.exec(l),d=+((/ depth (\d+)/.exec(l)||[])[1]||0);
   if(sc&&pv){let v=+sc[2];if(t.turn==='b')v=-v;const r={cp:sc[1]==='cp'?v:null,mate:sc[1]==='mate'?v:null,d,pv:pv[1].split(' ')};r.best=r.pv[0];t.last=r;if(t.onInfo)t.onInfo(r)}}
  else if(l.startsWith('bestmove')){clearTimeout(t.timer);run=null;const r=t.last;if(r&&!r.best)r.best=l.split(' ')[1];t.resolve(r||null)}}
 function go(fen,turn,onInfo){return new Promise(resolve=>{const t={turn,last:null,onInfo,resolve,timer:null};run=t;
  w.postMessage('position fen '+fen);w.postMessage('go depth '+AN_DEPTH);t.timer=setTimeout(()=>{if(run===t)w.postMessage('stop')},AN_MAXMS)})}
 /* eval(pos,onInfo): hasil dari sisi Putih {cp|mate,best,pv,d}. Permintaan baru menghentikan hitungan yang sedang jalan. */
 function ev(pos,onInfo){keep();const fen=toFen(pos);if(cache.has(fen)){const c=cache.get(fen);if(onInfo)onInfo(c);return Promise.resolve(c)}
  if(run)try{w.postMessage('stop')}catch(e){}
  const p=chain.then(()=>boot()).then(()=>cache.has(fen)?cache.get(fen):go(fen,pos.turn,onInfo).then(r=>{if(r&&r.d>=8)cache.set(fen,r);return r}));
  chain=p.catch(()=>{});return p}
 return{ev,release,get ok(){return ok}}})();

const winP=r=>{const cp=r.mate!=null?(r.mate>0?1e4:-1e4):r.cp;return 50+50*(2/(1+Math.exp(-0.00368208*Math.max(-1e4,Math.min(1e4,cp))))-1)};
const BADGE={best:['Best','★','#2c7a3c'],excellent:['Excellent','!','#4f9a5e'],good:['Good','✓','#7d9a45'],inaccuracy:['Inaccuracy','?!','#c99a14'],mistake:['Mistake','?','#dc7a1f'],blunder:['Blunder','??','#c0392b']};
/* sisi=warna yang melangkah, rp=evaluasi sebelum langkah, rc=sesudah, isBest=langkah = pilihan mesin */
function klasifikasi(sisi,rp,rc,isBest){if(isBest)return'best';const a=winP(rp),b=winP(rc),loss=sisi==='w'?a-b:b-a;
 return loss<2?'excellent':loss<5?'good':loss<10?'inaccuracy':loss<20?'mistake':'blunder'}

const AN={on:false,line:[],main:[],i:0,tok:0,g:null,me:null};

function anG(){if(!AN.g||!AN.g.isConnected)AN.g=mk('g',{style:'pointer-events:none'},svg);return AN.g}
/* panah gaya Lichess: tebal, ujung membulat, satu bentuk transparan (tidak menumpuk gelap di sambungan) */
function arrowD(a,b){const[ax,ay]=xy(a),[bx,by]=xy(b),x0=ax+50,y0=ay+50,x1=bx+50,y1=by+50,dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
 const SW=11,HW=30,HL=40,ST=16,tipD=L-9,baseD=Math.max(ST+8,tipD-HL),pt=(d,o)=>[x0+ux*d+nx*o,y0+uy*d+ny*o];
 const P=[pt(ST,SW),pt(baseD,SW),pt(baseD,HW),pt(tipD,0),pt(baseD,-HW),pt(baseD,-SW),pt(ST,-SW)];
 return'M'+P.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z'}
function anDraw(best,mv,badge){const G=anG();G.innerHTML='';
 if(best){const g=mk('g',{opacity:.58,class:'anarr'},G);mk('path',{d:arrowD(best.f,best.t),fill:'#2f9a4c',stroke:'#2f9a4c','stroke-width':9,'stroke-linejoin':'round'},g)}
 if(badge&&mv){const B=BADGE[badge],[x,y]=xy(mv.t),g=mk('g',{class:'anarr'},G);mk('circle',{cx:x+85,cy:y+15,r:17,fill:B[2],stroke:'#fff','stroke-width':3},g);
  const t=mk('text',{x:x+85,y:y+15,'text-anchor':'middle','dominant-baseline':'central','font-size':B[1].length>1?17:21,'font-family':'Gabarito,sans-serif','font-weight':800,fill:'#fff'},g);t.textContent=B[1]}}
function barSet(r){const f=$('evF'),n=$('evN'),bar=$('evb');if(!r){n.textContent='…';return}
 if(r.term){f.style.width=(r.term==='draw'?50:r.cp>0?100:0)+'%';n.textContent=r.term==='draw'?'½':r.cp>0?'1-0':'0-1';bar.classList.toggle('bl',r.term!=='draw'&&r.cp<0);return}
 const wp=winP(r);f.style.width=wp.toFixed(1)+'%';
 n.textContent=r.mate!=null?(r.mate>0?'+':'−')+'M'+Math.abs(r.mate):(r.cp>0?'+':r.cp<0?'−':'')+fmt((Math.abs(r.cp)/100).toFixed(1));bar.classList.toggle('bl',wp<50)}
async function anEvalPos(pos,onInfo){if(!legal(pos).length)return inCheck(pos)?{cp:pos.turn==='w'?-1e4:1e4,term:'mate'}:{cp:0,term:'draw'};return SF.ev(pos,onInfo)}
async function anEval(i,say){const tok=++AN.tok,n=AN.line[i],pos=n.pos,B=$('anBest');B.textContent=SF.ok?tx('anThink'):tx('anLoad');$('anBadge').innerHTML='';anDraw(null);barSet(null);
 let r;try{r=await anEvalPos(pos,x=>{if(tok===AN.tok)barSet(x)})}catch(e){if(tok===AN.tok){B.textContent=tx('anFail');$('evN').textContent='—'}return}
 if(tok!==AN.tok||!r)return;barSet(r);let best=null;B.textContent='';
 if(r.best&&!r.term){best=findM(pos,r.best);if(best){B.append(tx('anBest')+': ');const s=document.createElement('span');figInto(s,sanOf(pos,best),null);B.appendChild(s)}}
 anDraw(best,null,null);
 if(i>0&&n.m){const pv=AN.line[i-1];let rp;try{rp=await anEvalPos(pv.pos)}catch(e){return}if(tok!==AN.tok||!rp)return;
  const u=uciOf(n.m),isBest=!!rp.best&&(u===rp.best||u===rp.best+'q'),k=klasifikasi(pv.pos.turn,rp,r,isBest),b=BADGE[k];
  const sp=$('anBadge');sp.innerHTML='';const e=document.createElement('span');e.className='anbadge';e.style.background=b[2];e.textContent=b[1]+' '+b[0];sp.appendChild(e);
  anDraw(best,n.m,k)}}
function anUI(){const me=AN.me,n=AN.line[AN.i],L=AN.line.length;$('a0').disabled=$('a1').disabled=AN.i<=0;$('a2').disabled=$('a3').disabled=AN.i>=L-1;

 me.pos=n.pos;me.last=n.m||null;me.sel=-1;view.dots.innerHTML='';view.wd.innerHTML='';updateCheck(n.pos);anUI();anEval(i,o.say)}
async function anMove(f,t){const pos=cur.pos,C=legal(pos).filter(m=>m.f===f&&m.t===t);select(-1);
 if(!C.length){boardFx('shake');say(tx('illegal'));buzz(30);return}

  const b=document.createElement('button');b.className='chip no';b.append(tx('anMine')+': ');const s=document.createElement('span');figInto(s,moveNo(me,w.j+1)+sanOf(p0,m),null);b.appendChild(s);
